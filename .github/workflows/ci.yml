
name: CI/CD TPFI IS2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar calidad del codigo
        run: |
          python -m ruff check .
          python -m black --check .
          python -m pycodestyle --config=.pycodestyle src tests
          python -m pydocstyle src

      - name: Ejecutar pruebas
        run: python -m pytest --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: src

      - name: Generar documentacion con pdoc
        run: python -m pdoc --output-directory docs src
        env:
          PYTHONPATH: src

      - name: Guardar documentacion generada
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-tpfi
          path: docs/

      - name: Preparar documentacion para GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  publicar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar documentacion
        id: deployment
        uses: actions/deploy-pages@v4
